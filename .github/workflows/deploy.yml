name: Deploy CBS LMS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cbs-lms-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to AWS Production
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy CBS LMS
        shell: bash
        run: |
          set -Eeuo pipefail

          PROJECT="/home/ubuntu/cbs_lms_project"

          echo "========================================"
          echo "CBS LMS DEPLOYMENT STARTED"
          echo "========================================"

          cd "$PROJECT"

          echo "===== Environment ====="
          node -v
          npm -v
          pm2 -v

          echo "===== Current production commit ====="
          git rev-parse HEAD

          echo "===== Checking production working tree ====="
          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: Production working tree is not clean."
            echo "Refusing to deploy to avoid overwriting server-side tracked changes."
            git status --short
            exit 1
          fi
          echo "Production working tree: CLEAN"

          echo "===== Fetching latest main ====="
          git fetch origin main

          echo "===== Target commit ====="
          git rev-parse origin/main

          echo "===== Updating source code ====="
          git checkout main
          git reset --hard origin/main

          echo "===== Deployed commit ====="
          git rev-parse HEAD

          echo "===== Backend dependencies ====="
          cd "$PROJECT/back-end"
          npm ci --omit=dev

          echo "===== Frontend dependencies ====="
          cd "$PROJECT/front-end"
          npm ci

          echo "===== Building frontend ====="
          npm run build

          echo "===== Frontend build verification ====="
          test -f "$PROJECT/front-end/dist/index.html"
          echo "Frontend build: OK"

          echo "===== Restarting backend ====="
          pm2 restart cbs-lms-backend --update-env

          echo "===== Restarting frontend ====="
          pm2 restart cbs-lms-frontend --update-env

          echo "===== Waiting for applications ====="
          sleep 5

          echo "===== PM2 STATUS ====="
          pm2 status

          echo "===== Backend verification ====="
          pm2 show cbs-lms-backend | grep -E "status|script path|exec cwd"

          echo "===== Frontend verification ====="
          pm2 show cbs-lms-frontend | grep -E "status|script path|script args|exec cwd"

          echo "===== Port verification ====="
          sudo ss -ltnp | grep ':5000 ' || {
            echo "ERROR: Backend port 5000 is not listening"
            exit 1
          }

          sudo ss -ltnp | grep ':8080 ' || {
            echo "ERROR: Frontend port 8080 is not listening"
            exit 1
          }

          echo "Ports 5000 and 8080: OK"

          echo "===== Application health ====="
          curl -fsS --max-time 10 http://127.0.0.1:8080/ > /dev/null
          echo "Frontend HTTP: OK"

          echo "===== Saving PM2 configuration ====="
          pm2 save

          echo "===== Production-only files check ====="
          test -f "$PROJECT/.env" && echo ".env: OK" || echo ".env: NOT FOUND"
          test -d "$PROJECT/uploads" && echo "uploads/: OK" || echo "uploads/: NOT FOUND"
          test -f "$PROJECT/lms.sql" && echo "lms.sql: OK" || echo "lms.sql: NOT FOUND"

          echo "===== Final deployed commit ====="
          cd "$PROJECT"
          git rev-parse HEAD

          echo "========================================"
          echo "DEPLOYMENT FINISHED SUCCESSFULLY"
          echo "========================================"
